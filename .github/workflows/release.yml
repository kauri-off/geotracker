name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag, e.g. v0.1.0"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            name: mockwalk-linux-x64
          - target: bun-linux-arm64
            name: mockwalk-linux-arm64
          - target: bun-darwin-arm64
            name: mockwalk-macos-arm64
          - target: bun-darwin-x64
            name: mockwalk-macos-x64
          - target: bun-windows-x64
            name: mockwalk-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - run: bun test
      - run: bun build --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.name }} src/server.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cd dist && sha256sum * > SHA256SUMS && ls -la
      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ inputs.version }}"
          git push -f origin "${{ inputs.version }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Mock Walk ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dist/*
